- title: "GenTact-Prox: Tactile and Proximity Sensing"
  description: "Extends GenTact with capacitive sensing for proximity detection (up to 18 cm) and contact anticipation. Introduces a data-driven framework for mapping the proximal receptive field, enabling robots to perceive and respond to nearby objects before contact occurs."
